name: auralight
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'  # Fixed: Use proper format

dependencies:
  flutter:
    sdk: flutter

  # Image picking
  image_picker: ^1.1.1
  
  # Text Recognition
  google_mlkit_text_recognition: ^0.12.0
  
  # Text to Speech
  flutter_tts: ^3.8.0
  
  # Path provider
  path_provider: ^2.1.4
  
  # Speech to Text (use stable version)
  speech_to_text: 7.3.0  # Downgrade to stable version
  
  # Permission handler (FIXED: Move comment to next line)
  permission_handler: ^12.0.0 # For permissions
  
  # URL Launcher
  url_launcher: ^6.1.12

  # Cupertino Icons
  cupertino_icons: ^1.0.8
  
  # Audio players
  audioplayers: ^6.0.0
  
  # Camera
  camera: ^0.10.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Database
  sqflite: ^2.0.0
  
  # Notifications
  flutter_local_notifications: ^18.0.0
  
  # Timezone
  timezone: ^0.9.0
  
  # Lints
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/