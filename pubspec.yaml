name: auralight
description: "Auralight - Visually Impaired Assistant"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3

  # Media & ML
  camera: ^0.11.2+1
  image_picker: ^1.1.1
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.0.0

   # Speech & Emergency
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.0
  url_launcher: ^6.1.12


  # Storage & System
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  cupertino_icons: ^1.0.8
  path: ^1.9.1
  shared_preferences: ^2.5.3
  tesseract_ocr: ^0.5.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
