name: auralight
description: "Auralight - Visually Impaired Assistant"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0

  # Media & ML
  camera: ^0.10.5+5
  image_picker: ^1.1.1
  google_mlkit_text_recognition: ^0.12.0
  flutter_tts: ^3.8.5
  audioplayers: ^6.0.0

   # Speech & Emergency
  speech_to_text: ^6.6.2
  permission_handler: ^12.0.0
  url_launcher: ^6.1.12


  # Storage & System
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
